name: hive-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Dry referee: physics-adjacent python + sunshine honesty.
# Sensors still fly on wargen. No Godot on GitHub-hosted runners.

jobs:
  hive-referee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest hive honesty
        run: |
          python3 -m pip install pytest
          python3 -m pytest tests/test_hive_promote.py tests/test_sunshine_gates.py tests/test_lane_minimalism.py -q
      - name: campaign spec — generated files in sync, every campaign playable
        run: |
          python3 tools/campaign/build.py --check
          python3 tools/campaign/validate.py
          python3 -m pytest tests/test_campaign_spec.py tests/test_campaign_partition.py tests/test_story_cascade_pacing.py tests/test_tutorial_arc_lint.py -q
