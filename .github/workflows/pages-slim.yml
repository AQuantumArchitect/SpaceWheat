# Builds both shipping exports from the same commit and deploys Web-Slim to
# GitHub Pages.
#
# - Web-Slim: no music, no raster art (SVG only), non-threaded engine +
#   native/bin/web/libquantummatrix.nothreads.wasm, so Pages needs no COOP/COEP.
# - Windows Desktop: the full itch build (checked for the exe and native DLL,
#   not uploaded — 260 MB; releases go through tools/release.ps1).
#
# Pull requests build both (no deploy). Only a push to main deploys, so the
# live site changes only through a merged PR.
name: Pages (Web-Slim)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.2-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Godot + templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}
      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.2.stable
      - name: Export Web-Slim
        run: GODOT4=~/godot/godot ./scripts/build-web-slim.sh
      - name: Export Windows Desktop (full build, check only)
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/SpaceWheat.exe
          test -f build/windows/SpaceWheat.exe
          test -f build/windows/libquantummatrix.windows.template_release.x86_64.dll
          du -sh build/windows
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web-slim

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
