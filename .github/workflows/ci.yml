name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The whole suite against the real game: Godot 4.5 headless + the prebuilt
# native library in native/bin/linux. SW_SKIP_LONG=1 skips the multi-minute
# campaign drives, which run on the playtest fleet instead.

env:
  GODOT_VERSION: "4.5-stable"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot

      - name: Put Godot on PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python3 -m pip install pytest pytest-timeout

      - name: Import the project
        run: godot --headless --audio-driver Dummy --path . --import 2>&1 | tail -5

      - name: Boot without script errors
        run: |
          n=$(timeout 120 godot --headless --audio-driver Dummy --path . --quit 2>&1 \
                | grep -cE "SCRIPT ERROR|Parse Error|ERROR: Failed to" || true)
          echo "boot errors: $n"
          test "$n" = "0"

      - name: Campaign spec is compiled and completable
        run: |
          python3 tools/campaign/build.py --check
          python3 tools/campaign/validate.py

      - name: Test suite
        env:
          SW_SKIP_LONG: "1"
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q -p no:cacheprovider --timeout=600 -rs 2>&1 | tee pytest.log
          echo "::notice title=pytest::$(tail -1 pytest.log)"
