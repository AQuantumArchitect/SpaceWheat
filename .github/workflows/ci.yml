name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The whole suite against the real game: Godot 4.6.2 headless + the prebuilt
# native library in native/bin/linux. SW_SKIP_LONG=1 skips the multi-minute
# campaign drives, which run on the playtest fleet instead.

env:
  GODOT_VERSION: "4.6.2-stable"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot

      - name: Put Godot on PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: python3 -m pip install pytest pytest-timeout

      - name: Import the project
        run: godot --headless --audio-driver Dummy --path . --import 2>&1 | tail -5

      - name: Boot without script errors
        run: |
          n=$(timeout 120 godot --headless --audio-driver Dummy --path . --quit 2>&1 \
                | grep -cE "SCRIPT ERROR|Parse Error|ERROR: Failed to" || true)
          echo "boot errors: $n"
          test "$n" = "0"

      - name: Campaign spec is compiled and completable
        run: |
          python3 tools/campaign/build.py --check
          python3 tools/campaign/validate.py

      - name: Test suite
        env:
          SW_SKIP_LONG: "1"
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q -p no:cacheprovider --timeout=600 -rs 2>&1 | tee pytest.log
          echo "::notice title=pytest::$(tail -1 pytest.log)"

  # The shipping exports, built by the same script a release uses (tools/build.ps1).
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Godot + templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Install Godot + export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.2.stable

      - name: Export Windows
        run: pwsh -File tools/build.ps1 -Preset windows -Out "$PWD/build/windows" -Godot "$HOME/godot/godot"

      - name: Export Web-Slim
        run: pwsh -File tools/build.ps1 -Preset web-slim -Out "$PWD/build/web-slim" -Godot "$HOME/godot/godot"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: web-slim
          path: build/web-slim
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
