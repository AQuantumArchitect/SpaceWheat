# SpaceWheat Arena Parameter Space
# ══════════════════════════════════════════════════════════════════════
# Reference document for LLM agents operating in the 🍄/🎛️ habitat.
#
# This file is the single source of truth for:
#   - Orchestration vocabulary (what each term means)
#   - Arena modes and their default settings
#   - Tissue knobs (the 29 Graph Tissue™ learnable weights)
#   - PolicyGraph paths each knob controls
#   - Scoring dimensions and their weights
#   - Lichen (Claura) axiom → scoring coupling
#
# Graph Tissue™ is a trademark of Luke Spooner.
# ══════════════════════════════════════════════════════════════════════

# ── Vocabulary ─────────────────────────────────────────────────────
# One concept per entry.  emoji is the canonical tag used in JSON output
# and CLI output.  Do not hardcode emoji meanings elsewhere — import from
# emoji.py or refer to this file.

vocabulary:
  derby:
    emoji: "🏆"
    layer: orchestration
    description: >
      Multi-lane competition event.  Runs multiple characters against multiple
      policies in parallel, scores each lane, and feeds results to tissue learning.

  race:
    emoji: "🏁"
    layer: orchestration
    description: >
      Round-robin race on a single profile or character.  Fibonacci-scheduled:
      runners get additional cycles in fib-step increments until win-threshold
      runners complete.

  lane:
    emoji: "🧬"
    layer: orchestration
    description: >
      LLM competitor identity — e.g. "sonnet", "codex", "engine_policy",
      "quantum_register".  In character mode, lanes are policy modes rather
      than named LLMs.

  runner:
    emoji: "🎽"
    layer: orchestration
    description: >
      One profile/character instance in a competition.  Produces a single
      RunResult: steps, cycles, found_milk, vocab_pairs, biomes_visited.

  character:
    emoji: "🃏"
    layer: config
    description: >
      Higher-order spec combining a world-state profile + a PolicyGraph path.
      Defined in config/characters/*.json.  Has its own carefully-tuned
      starting resources — never override with tissue resources.

  profile:
    emoji: "🎯"
    layer: config
    description: >
      Starter world-state config in config/world_state/*.json.  Sets initial
      resources, biome, known_pairs, etc.

  batch:
    emoji: "📦"
    layer: orchestration
    description: >
      N independent runs of the same profile/character, executed in parallel.
      Aggregated into a batch_summary.

  run:
    emoji: "🧪"
    layer: result
    description: >
      One complete trial: seed → Godot headless play → JSON result.
      The atomic unit of competition data.

  cycle:
    emoji: "🔁"
    layer: game
    description: >
      One offer→accept→complete quest loop inside the game.  Max cycles per
      run is the primary throttle for exploration depth.

  step:
    emoji: "👣"
    layer: game
    description: >
      One action/decision within a cycle.  Steps accumulate toward speed_score.

  policy:
    emoji: "🧠"
    layer: game
    description: >
      Decision-making function applied by the hunter inside Godot.
      Two modes: engine_policy (rule-based UCB), quantum_register (Born-rule).

  tissue:
    emoji: "📊"
    layer: learning
    description: >
      Graph Tissue™ weight system.  29 EMA-evolved knobs that project via
      delta "add" ops onto each character's PolicyGraph.  Stored in
      config/tissue_ledger.jsonl.

  lichen:
    emoji: "🍄"
    layer: learning
    description: >
      Quantum lichen organism (Claura bridge).  Reads the CalibrationGraph
      and maps 4 axioms to scoring-weight shifts, making the fitness function
      adaptive across epochs.

  seed:
    emoji: "🌱"
    layer: game
    description: >
      Save-slot initialization.  Per-epoch seed randomization uses
      unix_time + slot*17, so vocabulary layout differs every epoch.

  slot:
    emoji: "🎰"
    layer: game
    description: Godot save slot number (integer).


# ── Run modes (arena.py) ──────────────────────────────────────────
# All modes share --console-profile {quiet,normal,debug,trace,test}.

modes:
  race:
    description: Round-robin race on one profile or character.
    args:
      --profile:         {type: str,   required: "one of profile/character", help: "Profile name"}
      --character:       {type: str,   required: "one of profile/character", help: "Character spec name"}
      --runners:         {type: int,   default: 5,   help: "Number of runners (2-5)"}
      --max-cycles:      {type: int,   default: 220, help: "Hard cap on cycles per runner"}
      --win-threshold:   {type: int,   default: 4,   help: "Stop after N runners complete"}
      --hunter-policy:   {type: str,   default: engine_policy, choices: [engine_policy, quantum_register]}

  duel:
    description: Head-to-head lane competition.
    args:
      --lanes:           {type: list,  default: [sonnet, codex], help: "Lane names (profile mode)"}
      --characters:      {type: list,  default: null, help: "Character specs; enables character mode"}
      --policies:        {type: list,  default: [engine_policy, quantum_register]}
      --runners-per-lane:{type: int,   default: 5}
      --max-cycles:      {type: int,   default: 220}

  matrix:
    description: Batch comparison across multiple profiles.
    args:
      --profiles:        {type: str,   required: true, help: "Comma-sep or glob, e.g. 'derby_*'"}
      --runs:            {type: int,   default: 3}
      --max-cycles:      {type: int,   default: 220}

  design:
    description: Evaluate a Claura-proposed character vs baselines.
    args:
      --character:       {type: str,   required: true, help: "Proposed character name"}
      --baselines:       {type: list,  default: null,  help: "Default: all other characters"}
      --max-cycles:      {type: int,   default: 55,    help: "Short eval window"}

  train:
    description: >
      Continuous adversarial learning loop.  Runs duel epochs, applies tissue
      evolution between epochs, and auto-scales max_cycles until win rate
      reaches --target-win-rate.
    args:
      --characters:      {type: list,  default: null,  help: "Default: all available characters"}
      --policies:        {type: list,  default: [engine_policy, quantum_register]}
      --epochs:          {type: int,   default: 10}
      --max-cycles:      {type: int,   default: 55,    help: "Starting value; auto-scales upward"}
      --target-win-rate: {type: float, default: 0.80,  help: "Scale max_cycles until this win rate is hit"}
      --cycles-step:     {type: int,   default: 13,    help: "Increment per epoch when below target"}
      --no-lichen:       {type: bool,  default: false, help: "Disable Claura lichen scoring modulation"}
    scaling_cap: 220   # hard ceiling matching MAX_LOOPS_DEFAULT in milk_hunt_batch.conf


# ── Scoring dimensions ────────────────────────────────────────────
# Base weights sum to 1.0.  Lichen axioms can shift each by ±0.15,
# clamped to ≥0.05, then renormalized.

scoring:
  dimensions:
    success_rate:
      emoji: "🍼"
      base_weight: 0.50
      description: "Binary: did the runner find the milk vocabulary pair?"
      lichen_axiom: strength    # J(strength) → reliable outcomes

    speed_score:
      emoji: "⚡"
      base_weight: 0.25
      description: "Normalized steps-to-milk (fewer steps = higher score)."
      lichen_axiom: rate        # τ(rate) → value rapid convergence

    biome_score:
      emoji: "🗺️"
      base_weight: 0.15
      description: "Fraction of available biomes visited."
      lichen_axiom: sensitivity # θ(sensitivity) → value biome coverage

    vocab_score:
      emoji: "📖"
      base_weight: 0.10
      description: "Vocabulary pair breadth discovered."
      lichen_axiom: breadth     # σ(breadth) → value vocabulary breadth

  composite:
    emoji: "🏆"
    formula: "success_rate*w_sr + speed_score*w_sp + biome_score*w_bi + vocab_score*w_vo"

  lichen_axiom_shift:
    max_shift_per_axiom: 0.15
    weight_floor: 0.05
    description: >
      Each CalibrationGraph axiom ∈ [0,1] shifts its dimension by
      (axiom - 0.5) * 2 * 0.15.  Weights are clamped then renormalized.


# ── Tissue knobs (WEIGHT_RANGES) ──────────────────────────────────
# 29 Graph Tissue™ learnable weights.  Each has a default value and a
# valid range.  The EMA alpha is 0.30.  Evolved defaults are stored in
# config/tissue_ledger.jsonl.
#
# policy_path: the PolicyGraph JSONL path this knob projects to (if any).
# mode: how the knob value maps to the policy value:
#   ratio   → policy_value = base_policy_value * (knob / knob_seed_default)
#   direct  → policy_value = knob
#   inverse → policy_value = base_policy_value * (knob_seed_default / knob)
# At seed defaults, delta ops are zero — character policies are unchanged.

tissue_knobs:

  # ── Offer group: quest/lock action priors + reward terms ──────────
  offer_pair:
    default: 1.0
    range: [0.3, 3.0]
    policy_path: reward_terms.pair
    policy_base: 42.0
    mode: ratio
    description: "Reward multiplier for completing vocabulary-pair quests."

  offer_novelty:
    default: 1.0
    range: [0.3, 4.0]
    policy_path: action_priors.quest_cycle.unknown_vocab
    policy_base: 1.25
    mode: ratio
    description: "Prior for accepting quests with unknown vocab terms."

  offer_reward:
    default: 0.04
    range: [0.01, 0.15]
    policy_path: reward_terms.resource
    policy_base: 0.08
    mode: ratio
    description: "Resource reward scaling coefficient."

  offer_deficit:
    default: 0.9
    range: [0.3, 2.0]
    policy_path: action_priors.quest_cycle.stagnation_scale
    policy_base: 0.45
    mode: ratio
    description: "How strongly stagnation (no progress) penalizes quest acceptance."

  offer_delivery_cost:
    default: -0.06
    range: [-0.15, -0.01]
    policy_path: reward_terms.execution_penalty
    policy_base: -4.0
    mode: ratio
    description: "Penalty applied for execution overhead on quest delivery."

  offer_milk_direct:
    default: 900.0
    range: [500.0, 2000.0]
    policy_path: null
    description: "Direct reward bonus when the milk pair is discovered. Not yet wired to PolicyGraph."

  offer_critical_any:
    default: 2.0
    range: [0.5, 10.0]
    policy_path: action_priors.lock_offer.discovery_affinity
    policy_base: 5.0
    mode: ratio
    description: "Affinity for locking offers that involve any critical resource."

  offer_critical_unknown:
    default: 7.0
    range: [2.0, 40.0]
    policy_path: action_priors.lock_offer.novelty
    policy_base: 1.5
    mode: ratio
    description: "Boost for locking offers that introduce unknown critical vocab."

  offer_critical_pair:
    default: 16.0
    range: [4.0, 100.0]
    policy_path: null
    description: "Bonus for discovering a critical vocabulary pair. Not yet wired to PolicyGraph."

  # ── Probe group: probe_cycle and discover_biome priors ────────────
  probe_frontier:
    default: 1.0
    range: [0.3, 3.0]
    policy_path: action_priors.probe_cycle.base
    policy_base: 1.0
    mode: ratio
    description: "Base prior for initiating a probe cycle (exploring a biome)."

  probe_hits:
    default: 0.8
    range: [0.2, 2.0]
    policy_path: action_priors.probe_cycle.resource_pressure
    policy_base: 0.3
    mode: ratio
    description: "How much resource pressure increases probe frequency."

  probe_novelty:
    default: 0.4
    range: [0.1, 1.5]
    policy_path: action_priors.discover_biome.base
    policy_base: 0.35
    mode: ratio
    description: "Base prior for biome discovery actions."

  probe_critical_hits:
    default: 1.2
    range: [0.3, 3.0]
    policy_path: action_priors.probe_cycle.biome_pressure
    policy_base: 0.15
    mode: ratio
    description: "Extra probe pressure when critical resources are being hit."

  probe_village_pressure:
    default: 0.8
    range: [0.2, 3.0]
    policy_path: null
    description: "Village-specific probe pressure scaling. Not yet wired to PolicyGraph."

  probe_village_known_critical:
    default: 0.25
    range: [0.05, 1.5]
    policy_path: null
    description: "Probe discount when village critical resources are already known."

  # ── Loop group: per-cycle probe limits ───────────────────────────
  loop_probe_base:
    default: 1.0
    range: [0.0, 3.0]
    policy_path: null
    description: "Base probe count target per cycle. Not yet wired to PolicyGraph."

  loop_probe_pair_scale:
    default: 0.10
    range: [0.0, 0.5]
    policy_path: null
    description: "Probe count scaling per discovered pair. Not yet wired."

  loop_probe_floor_pressure:
    default: 1.0
    range: [0.0, 2.0]
    policy_path: action_priors.time_skip.base
    policy_base: 0.4
    mode: inverse
    description: "High floor pressure suppresses time_skip (forces action)."

  loop_probe_critical_pressure:
    default: 1.0
    range: [0.0, 2.0]
    policy_path: null
    description: "Extra probes when critical resources are below threshold."

  loop_probe_strict_bonus:
    default: 1.0
    range: [0.0, 2.0]
    policy_path: null
    description: "Probe bonus in strict mode (all quests must match vocab)."

  loop_probe_max:
    default: 4.0
    range: [1.0, 8.0]
    policy_path: action_limits.default.max_per_loop
    policy_base: 1
    mode: direct
    description: "Hard cap on probe actions per cycle."

  # ── Vocab group: quest acceptance priors ─────────────────────────
  vocab_probe_base:
    default: 1.0
    range: [0.0, 3.0]
    policy_path: action_priors.quest_cycle.base
    policy_base: 0.7
    mode: ratio
    description: "Base prior for entering the quest/vocab learning cycle."

  vocab_probe_per_pair:
    default: 1.0
    range: [0.0, 3.0]
    policy_path: null
    description: "Quest acceptance boost per already-known pair."

  vocab_probe_max:
    default: 6.0
    range: [1.0, 10.0]
    policy_path: null
    description: "Max vocab probes per cycle. Not yet wired to PolicyGraph."

  # ── Lindblad group: lindblad_drain (entropy dissipation) priors ──
  lindblad_hits:
    default: 1.1
    range: [0.3, 2.5]
    policy_path: action_priors.lindblad_drain.base
    policy_base: 0.9
    mode: ratio
    description: "Base prior for lindblad_drain action (entropy dissipation step)."

  lindblad_critical_hits:
    default: 1.6
    range: [0.5, 3.5]
    policy_path: null
    description: "Lindblad drain boost on critical resource hits."

  lindblad_floor_hits:
    default: 1.8
    range: [0.5, 4.0]
    policy_path: null
    description: "Lindblad drain boost when resources hit floor threshold."

  lindblad_frontier:
    default: 0.35
    range: [0.1, 1.5]
    policy_path: action_priors.lindblad_drain.inactive_bonus
    policy_base: 0.5
    mode: ratio
    description: "Lindblad bonus when exploring a previously-inactive biome."

  lindblad_novelty:
    default: 0.45
    range: [0.1, 1.5]
    policy_path: null
    description: "Lindblad novelty bonus for new vocab context."

  lindblad_village_pressure:
    default: 0.8
    range: [0.2, 2.5]
    policy_path: null
    description: "Village-specific lindblad drain scaling."


# ── PolicyGraph wiring summary ───────────────────────────────────
# Quick lookup: policy path → which tissue knob controls it.
# All ops are "add" (delta), not "set" (absolute).

policy_graph_wiring:
  reward_terms.pair:                              offer_pair
  reward_terms.resource:                          offer_reward
  reward_terms.execution_penalty:                 offer_delivery_cost
  action_priors.quest_cycle.unknown_vocab:        offer_novelty
  action_priors.quest_cycle.stagnation_scale:     offer_deficit
  action_priors.quest_cycle.base:                 vocab_probe_base
  action_priors.lock_offer.discovery_affinity:    offer_critical_any
  action_priors.lock_offer.novelty:               offer_critical_unknown
  action_priors.probe_cycle.base:                 probe_frontier
  action_priors.probe_cycle.resource_pressure:    probe_hits
  action_priors.probe_cycle.biome_pressure:       probe_critical_hits
  action_priors.discover_biome.base:              probe_novelty
  action_priors.lindblad_drain.base:              lindblad_hits
  action_priors.lindblad_drain.inactive_bonus:    lindblad_frontier
  action_priors.time_skip.base:                   loop_probe_floor_pressure  # inverse
  action_limits.default.max_per_loop:             loop_probe_max             # direct


# ── Known run modes (Godot game) ─────────────────────────────────
# Two distinct behaviors observed in practice:

run_modes:
  quest_mode:
    description: >
      Runner engages the quest/vocab learning cycle.
      vocab_pairs ≥ 1, quests_seen ≥ 1, steps vary widely.
    prevalence: "~57% of runs"
    milk_probability: "~5% per quest-mode run"
    typical_cycles_to_milk: [5, 7, 10]

  stuck_mode:
    description: >
      Runner never enters quest system.
      vocab_pairs = 0, quests_seen = 0, steps = exactly 127, cycles = 20.
      Root cause not yet identified — not a seed determinism issue
      (SaveStore.gd uses unix_time + slot*17 so each epoch gets a fresh
      vocab layout).
    prevalence: "~43% of runs"
    milk_probability: 0.0
    note: "Eliminating stuck mode is the highest-leverage improvement."


